<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elemental Explorer - Enhanced</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background-color: #0b0f19;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    user-select: none;
}
canvas {
    display: block;
}
#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    pointer-events: none;
    font-size: 16px;
    background: rgba(15, 23, 42, 0.7);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.stat {
    margin-bottom: 12px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}
.stat:last-child {
    margin-bottom: 0;
}
#controls {
    font-size: 11px;
    color: #8892b0;
    margin-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 10px;
}
</style>
</head>
<body>
<div id="ui">
    <div id="hp" class="stat">HP: 100</div>
    <div id="element" class="stat">Element: Pyro</div>
    <div id="score" class="stat">Score: 0</div>
    <div id="controls" class="stat">WASD: Move | Click: Attack | 1, 2, 3: Switch</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const uiHp = document.getElementById('hp');
const uiElement = document.getElementById('element');
const uiScore = document.getElementById('score');

let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let mouse = { x: canvas.width/2, y: canvas.height/2, down: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);

const elements = [
    { name: 'Pyro', color: '#ff4757', glow: 'rgba(255, 71, 87, 0.6)' },
    { name: 'Hydro', color: '#1e90ff', glow: 'rgba(30, 144, 255, 0.6)' },
    { name: 'Dendro', color: '#2ed573', glow: 'rgba(46, 213, 115, 0.6)' }
];

let currentElement = 0;
let player = { x: canvas.width / 2, y: canvas.height / 2, size: 18, speed: 6, hp: 100 };
let projectiles = [];
let enemies = [];
let particles = [];
let backgroundStars = [];
let score = 0;
let lastShoot = 0;
let time = 0;

for (let i = 0; i < 100; i++) {
    backgroundStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.1
    });
}

function spawnEnemy() {
    let side = Math.floor(Math.random() * 4);
    let ex, ey;
    if (side === 0) { ex = Math.random() * canvas.width; ey = -50; }
    else if (side === 1) { ex = canvas.width + 50; ey = Math.random() * canvas.height; }
    else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 50; }
    else { ex = -50; ey = Math.random() * canvas.height; }
    
    let el = Math.floor(Math.random() * 3);
    enemies.push({ x: ex, y: ey, size: 22, speed: 2.5, hp: 40, maxHp: 40, element: el, angle: 0 });
}

setInterval(spawnEnemy, 1000);

window.addEventListener('keydown', e => {
    if (e.key === '1') currentElement = 0;
    if (e.key === '2') currentElement = 1;
    if (e.key === '3') currentElement = 2;
});

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            size: Math.random() * 4 + 2,
            life: 1,
            decay: Math.random() * 0.03 + 0.02
        });
    }
}

function update() {
    time += 0.05;

    if (keys['w']) player.y -= player.speed;
    if (keys['s']) player.y += player.speed;
    if (keys['a']) player.x -= player.speed;
    if (keys['d']) player.x += player.speed;

    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    uiElement.innerText = 'Element: ' + elements[currentElement].name;
    uiElement.style.color = elements[currentElement].color;
    uiHp.innerText = 'HP: ' + player.hp;
    uiScore.innerText = 'Score: ' + score;

    let now = Date.now();
    if (mouse.down && now - lastShoot > 150) {
        let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        projectiles.push({
            x: player.x, y: player.y,
            vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
            element: currentElement, size: 8, life: 100
        });
        lastShoot = now;
        
        player.x -= Math.cos(angle) * 2;
        player.y -= Math.sin(angle) * 2;
    }

    for (let i = backgroundStars.length - 1; i >= 0; i--) {
        let star = backgroundStars[i];
        star.y += star.speed;
        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.size *= 0.95;
        if (p.life <= 0 || p.size < 0.1) {
            particles.splice(i, 1);
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        
        particles.push({
            x: p.x + (Math.random() - 0.5) * 5, y: p.y + (Math.random() - 0.5) * 5,
            vx: -p.vx * 0.1, vy: -p.vy * 0.1,
            color: elements[p.element].color,
            size: Math.random() * 3 + 1,
            life: 1, decay: 0.1
        });

        if (p.life <= 0 || p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
            projectiles.splice(i, 1);
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
        e.angle += 0.05;

        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.size + e.size) {
            player.hp -= 20;
            createParticles(player.x, player.y, '#ffffff', 20);
            enemies.splice(i, 1);
            if (player.hp <= 0) {
                alert('Game Over! Final Score: ' + score);
                player.hp = 100;
                score = 0;
                enemies = [];
                projectiles = [];
                particles = [];
            }
            continue;
        }

        for (let j = projectiles.length - 1; j >= 0; j--) {
            let p = projectiles[j];
            let pd = Math.hypot(p.x - e.x, p.y - e.y);
            
            if (pd < p.size + e.size) {
                let dmg = 15;
                if ((p.element === 0 && e.element === 2) || 
                    (p.element === 1 && e.element === 0) || 
                    (p.element === 2 && e.element === 1)) {
                    dmg = 50;
                    createParticles(e.x, e.y, '#ffffff', 10);
                } else if (p.element === e.element) {
                    dmg = 5;
                }

                e.hp -= dmg;
                createParticles(p.x, p.y, elements[p.element].color, 8);
                projectiles.splice(j, 1);
                
                if (e.hp <= 0) {
                    score += 15;
                    createParticles(e.x, e.y, elements[e.element].color, 30);
                    enemies.splice(i, 1);
                }
                break;
            }
        }
    }
}

function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0b0f19';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';

    ctx.fillStyle = '#1e293b';
    for (let star of backgroundStars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    for (let p of projectiles) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = elements[p.element].color;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = elements[p.element].color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = elements[e.element].color;
        
        ctx.strokeStyle = elements[e.element].color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(e.size, 0);
        ctx.lineTo(-e.size/2, e.size * 0.866);
        ctx.lineTo(-e.size/2, -e.size * 0.866);
        ctx.closePath();
        ctx.stroke();
        
        ctx.fillStyle = elements[e.element].glow;
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - 15, e.y - 30, 30, 4);
        ctx.fillStyle = elements[e.element].color;
        ctx.fillRect(e.x - 15, e.y - 30, 30 * (e.hp / e.maxHp), 4);
    }
    ctx.shadowBlur = 0;

    ctx.shadowBlur = 25;
    ctx.shadowColor = elements[currentElement].color;
    
    let pulse = Math.sin(time) * 3;
    
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size + pulse, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = elements[currentElement].color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, (player.size - 4) + pulse, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 0;

    let aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    let aimX = player.x + Math.cos(aimAngle) * 40;
    let aimY = player.y + Math.sin(aimAngle) * 40;
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(aimX, aimY);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.arc(aimX, aimY, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fill();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
