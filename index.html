<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Bird Fly - Fullscreen</title>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #050510;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas {
    display: block;
    background: linear-gradient(180deg, #0b0f19 0%, #1a1a2e 100%);
}
#scoreBoard {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 50px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px #0ff;
    z-index: 10;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="scoreBoard">0</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreBoard = document.getElementById("scoreBoard");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let frames = 0;
let score = 0;
let gameOver = false;
let particles = [];
let backgroundStars = [];

function initStars() {
    backgroundStars = [];
    for (let i = 0; i < 150; i++) {
        backgroundStars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speed: Math.random() * 0.5 + 0.1
        });
    }
}
initStars();

const bird = {
    x: Math.min(150, canvas.width / 4),
    y: canvas.height / 2,
    r: 18,
    velocity: 0,
    gravity: 0.35,
    jump: -7.5,
    rotation: 0,
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
        ctx.rotate(this.rotation);

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#0ff";
        ctx.fillStyle = "#0ff";
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(7, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.beginPath();
        ctx.ellipse(-7, 3, 9, 5, Math.sin(frames * 0.2) * 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    },
    update() {
        this.velocity += this.gravity;
        this.y += this.velocity;
        
        if (this.y + this.r >= canvas.height - 80) {
            this.y = canvas.height - 80 - this.r;
            if (!gameOver) die();
        }
        
        if (this.y - this.r <= 0) {
            this.y = this.r;
            this.velocity = 0;
        }
    },
    flap() {
        this.velocity = this.jump;
        for(let i=0; i<6; i++) {
            particles.push({
                x: this.x - 12,
                y: this.y + 12,
                vx: Math.random() * -3 - 1,
                vy: Math.random() * 2 - 1,
                size: Math.random() * 4 + 2,
                life: 1,
                color: "#0ff"
            });
        }
    }
};

const pipes = {
    items: [],
    w: 70,
    gap: 200,
    dx: 4,
    spawnCounter: 0,
    draw() {
        for (let i = 0; i < this.items.length; i++) {
            let p = this.items[i];
            
            let gradTop = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
            gradTop.addColorStop(0, "#f0f");
            gradTop.addColorStop(1, "#800080");

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#f0f";
            
            ctx.fillStyle = gradTop;
            ctx.fillRect(p.x, 0, this.w, p.top);
            ctx.fillRect(p.x - 5, p.top - 25, this.w + 10, 25);

            ctx.fillRect(p.x, canvas.height - p.bottom, this.w, p.bottom);
            ctx.fillRect(p.x - 5, canvas.height - p.bottom, this.w + 10, 25);

            ctx.shadowBlur = 0;
        }
    },
    update() {
        this.spawnCounter += (this.dx / 4);
        
        if (this.spawnCounter >= 140) {
            let topHeight = Math.max(80, Math.random() * (canvas.height - 80 - this.gap - 160));
            let bottomHeight = canvas.height - 80 - this.gap - topHeight;
            this.items.push({
                x: canvas.width,
                top: topHeight,
                bottom: bottomHeight,
                passed: false
            });
            this.spawnCounter = 0;
        }

        for (let i = 0; i < this.items.length; i++) {
            let p = this.items[i];
            p.x -= this.dx;

            if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + this.w && bird.y - bird.r < p.top) {
                if (!gameOver) die();
            }
            if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + this.w && bird.y + bird.r > canvas.height - p.bottom) {
                if (!gameOver) die();
            }

            if (p.x + this.w < bird.x - bird.r && !p.passed) {
                score++;
                scoreBoard.innerText = score;
                p.passed = true;
                if(this.dx < 8) this.dx += 0.15;
            }

            if (p.x + this.w < -100) {
                this.items.shift();
                i--;
            }
        }
    },
    reset() {
        this.items = [];
        this.dx = 4;
        this.spawnCounter = 0;
    }
};

const ground = {
    x: 0,
    h: 80,
    draw() {
        let y = canvas.height - this.h;
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#f0f";
        ctx.fillStyle = "#1a0033";
        ctx.fillRect(this.x, y, canvas.width * 2 + 200, this.h);
        
        ctx.fillStyle = "#f0f";
        ctx.fillRect(this.x, y, canvas.width * 2 + 200, 5);
        ctx.shadowBlur = 0;

        for (let i = 0; i < canvas.width * 2 + 200; i += 60) {
            ctx.fillStyle = "rgba(255, 0, 255, 0.2)";
            ctx.beginPath();
            ctx.moveTo(this.x + i, y + 5);
            ctx.lineTo(this.x + i - 40, y + this.h);
            ctx.lineTo(this.x + i - 15, y + this.h);
            ctx.lineTo(this.x + i + 25, y + 5);
            ctx.fill();
        }
    },
    update() {
        this.x -= pipes.dx;
        if (this.x <= -60) {
            this.x = 0;
        }
    }
};

function die() {
    gameOver = true;
    for(let i=0; i<40; i++) {
        particles.push({
            x: bird.x,
            y: bird.y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 6 + 2,
            life: 1,
            color: Math.random() > 0.5 ? "#0ff" : "#fff"
        });
    }
}

function handleInput() {
    if (gameOver) {
        if (particles.length > 0) return;
        bird.y = canvas.height / 2;
        bird.velocity = 0;
        bird.rotation = 0;
        pipes.reset();
        score = 0;
        scoreBoard.innerText = score;
        frames = 0;
        gameOver = false;
    } else {
        bird.flap();
    }
}

canvas.addEventListener("mousedown", handleInput);
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    handleInput();
}, {passive: false});
window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        handleInput();
    }
});

function draw() {
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    for (let star of backgroundStars) {
        ctx.globalAlpha = Math.random() * 0.5 + 0.5;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    pipes.draw();
    ground.draw();
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    if (!gameOver || particles.length > 0) {
        if (!gameOver) bird.draw();
    }
}

function update() {
    for (let star of backgroundStars) {
        star.x -= star.speed;
        if (star.x < 0) {
            star.x = canvas.width;
            star.y = Math.random() * canvas.height;
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.size *= 0.95;
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    if (!gameOver) {
        bird.update();
        ground.update();
        pipes.update();
        frames++;
    }
}

function loop() {
    update();
    draw();

    if (gameOver && particles.length === 0) {
        ctx.fillStyle = "rgba(0, 0, 10, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#0ff";
        ctx.font = "bold 5vw 'Segoe UI'";
        ctx.textAlign = "center";
        ctx.fillText("CRASHED", canvas.width/2, canvas.height/2 - 20);
        
        ctx.font = "2.5vw 'Segoe UI'";
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#aaa";
        ctx.fillText("Tap or Click to Restart", canvas.width/2, canvas.height/2 + 40);
        ctx.textAlign = "start";
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
