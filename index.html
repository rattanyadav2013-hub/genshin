<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Fly Game</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background-color: #70c5ce;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
}
canvas {
    background-color: #70c5ce;
    border: 2px solid #000;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
#scoreBoard {
    position: absolute;
    top: 30px;
    font-size: 40px;
    font-weight: bold;
    color: white;
    text-shadow: 3px 3px 0 #000;
    z-index: 10;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="scoreBoard">0</div>
<canvas id="gameCanvas" width="320" height="480"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreBoard = document.getElementById("scoreBoard");

let frames = 0;
let score = 0;
let gameOver = false;

const bird = {
    x: 50,
    y: 150,
    w: 30,
    h: 24,
    velocity: 0,
    gravity: 0.25,
    jump: -4.5,
    draw() {
        ctx.fillStyle = "#ffcc00";
        ctx.beginPath();
        ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + this.w/2 + 8, this.y + this.h/2 - 4, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(this.x + this.w/2 + 9, this.y + this.h/2 - 4, 2, 0, Math.PI * 2);
        ctx.fill();
    },
    update() {
        this.velocity += this.gravity;
        this.y += this.velocity;
        
        if (this.y + this.h >= canvas.height - 112) {
            this.y = canvas.height - 112 - this.h;
            gameOver = true;
        }
        
        if (this.y <= 0) {
            this.y = 0;
            this.velocity = 0;
        }
    },
    flap() {
        this.velocity = this.jump;
    }
};

const pipes = {
    items: [],
    w: 50,
    gap: 120,
    dx: 2,
    draw() {
        for (let i = 0; i < this.items.length; i++) {
            let p = this.items[i];
            
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(p.x, 0, this.w, p.top);
            ctx.fillStyle = "#558c22";
            ctx.fillRect(p.x + this.w - 10, 0, 10, p.top);
            ctx.strokeRect(p.x, 0, this.w, p.top);
            
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(p.x, canvas.height - p.bottom, this.w, p.bottom);
            ctx.fillStyle = "#558c22";
            ctx.fillRect(p.x + this.w - 10, canvas.height - p.bottom, 10, p.bottom);
            ctx.strokeRect(p.x, canvas.height - p.bottom, this.w, p.bottom);
            
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(p.x - 4, p.top - 20, this.w + 8, 20);
            ctx.strokeRect(p.x - 4, p.top - 20, this.w + 8, 20);
            
            ctx.fillRect(p.x - 4, canvas.height - p.bottom, this.w + 8, 20);
            ctx.strokeRect(p.x - 4, canvas.height - p.bottom, this.w + 8, 20);
        }
    },
    update() {
        if (frames % 100 === 0) {
            let topHeight = Math.max(50, Math.random() * (canvas.height - 112 - this.gap - 100));
            let bottomHeight = canvas.height - 112 - this.gap - topHeight;
            this.items.push({
                x: canvas.width,
                top: topHeight,
                bottom: bottomHeight,
                passed: false
            });
        }
        for (let i = 0; i < this.items.length; i++) {
            let p = this.items[i];
            p.x -= this.dx;

            if (bird.x + bird.w > p.x && bird.x < p.x + this.w && bird.y < p.top) {
                gameOver = true;
            }
            if (bird.x + bird.w > p.x && bird.x < p.x + this.w && bird.y + bird.h > canvas.height - p.bottom) {
                gameOver = true;
            }

            if (p.x + this.w < bird.x && !p.passed) {
                score++;
                scoreBoard.innerText = score;
                p.passed = true;
            }

            if (p.x + this.w < -20) {
                this.items.shift();
                i--;
            }
        }
    },
    reset() {
        this.items = [];
    }
};

const ground = {
    x: 0,
    y: canvas.height - 112,
    w: canvas.width,
    h: 112,
    dx: 2,
    draw() {
        ctx.fillStyle = "#ded895";
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillRect(this.x + this.w, this.y, this.w, this.h);
        
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(this.x, this.y, this.w, 15);
        ctx.fillRect(this.x + this.w, this.y, this.w, 15);
        
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.w * 2, this.y);
        ctx.stroke();
    },
    update() {
        this.x -= this.dx;
        if (this.x <= -this.w) {
            this.x = 0;
        }
    }
};

function handleInput() {
    if (gameOver) {
        bird.y = 150;
        bird.velocity = 0;
        pipes.reset();
        score = 0;
        scoreBoard.innerText = score;
        frames = 0;
        gameOver = false;
        loop();
    } else {
        bird.flap();
    }
}

canvas.addEventListener("mousedown", handleInput);
window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        handleInput();
    }
});

function draw() {
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    pipes.draw();
    ground.draw();
    bird.draw();
}

function update() {
    bird.update();
    ground.update();
    pipes.update();
}

function loop() {
    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.font = "bold 35px monospace";
        ctx.textAlign = "center";
        
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 20);
        ctx.strokeText("GAME OVER", canvas.width/2, canvas.height/2 - 20);
        
        ctx.font = "20px monospace";
        ctx.fillText("Click to Retry", canvas.width/2, canvas.height/2 + 20);
        ctx.strokeText("Click to Retry", canvas.width/2, canvas.height/2 + 20);
        
        ctx.textAlign = "start";
        return;
    }
    update();
    draw();
    frames++;
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
